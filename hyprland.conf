# -----------------------------------------------------
# MONITORS
# -----------------------------------------------------
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = DVI-D-1, 1280x1024@75, 1920x0, 1

# -----------------------------------------------------
# ENVIRONMENT VARIABLES
# -----------------------------------------------------
# Cursor
env = XCURSOR_THEME, Tela-dark
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, Tela-dark
env = HYPRCURSOR_SIZE, 24

# Backend
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Qt / KDE
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# -----------------------------------------------------
# AUTOSTART
# -----------------------------------------------------
# System
# exec-once = /usr/libexec/polkit-kde-authentication-agent-1
exec-once = systemctl --user start hyprpolkitagent

exec-once = hypridle
exec-once = hyprpaper
exec-once = GTK_THEME=Breeze waybar
exec-once = swaync

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Audio Effects
exec-once = easyeffects --service-mode

# -----------------------------------------------------
# INPUT & DEVICES
# -----------------------------------------------------
input {
	kb_layout = us,ru
	kb_options = grp:alt_shift_toggle
	follow_mouse = 2
	numlock_by_default = true
}

cursor {
	no_warps = true
}

device {
	name = logitech-g502-hero-gaming-mouse
	accel_profile = flat
	sensitivity = -0.35
}

# -----------------------------------------------------
# GENERAL & LAYOUT
# -----------------------------------------------------
general {
	gaps_in = 2
	gaps_out = 3
	border_size = 1
	col.active_border = rgba(170,170,180,0.9)
	col.inactive_border = rgba(30,30,46,0.7)
	layout = dwindle
	allow_tearing = true
}

dwindle {
	pseudotile = true
	preserve_split = true
	force_split = 2
}

xwayland {
	force_zero_scaling = true
}

# -----------------------------------------------------
# DECORATION & ANIMATION
# -----------------------------------------------------
decoration {
	rounding = 4

	active_opacity = 0.90
	inactive_opacity = 0.90
	
	blur {
		enabled = true
		size = 1
		passes = 1
	}

	shadow {
		enabled = true
		range = 5
		render_power = 3
		color = rgba(0,0,20,0.5)
	}
}

animations {
	enabled = true
	bezier = ease, 0.4, 0.02, 0.21, 1
	animation = windows, 1, 3, ease
	animation = workspaces, 1, 4, ease, slidevert
}

debug {
	overlay = false
}

# -----------------------------------------------------
# WINDOW RULES
# -----------------------------------------------------
# Floating Utils
windowrulev2 = float,class:^(org.kde.kcalc)$
windowrulev2 = center,class:^(org.kde.kcalc)$

windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = center,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 800 500,class:^(org.pulseaudio.pavucontrol)$

windowrulev2 = float,class:^(missioncenter)$
windowrulev2 = float,class:^(org.kde.plasma-systemmonitor)$
windowrulev2 = float,class:^(org.kde.ark)$

# Image Viewers
windowrulev2 = float,class:^(org.kde.gwenview)$
windowrulev2 = float,class:^(imv.desktop)$

# Dialogs (Save/Open file)
windowrulev2 = float,class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center,class:^(xdg-desktop-portal-gtk)$
windowrulev2 = dimaround,class:^(xdg-desktop-portal-gtk)$

# Telegram Media
windowrulev2 = float, title:^(Media viewer|Просмотр медиа)$, class:^(org.telegram.desktop.*)$
windowrulev2 = fullscreen, title:^(Media viewer|Просмотр медиа)$, class:^(org.telegram.desktop.*)$
windowrulev2 = workspace unset, title:^(Media viewer|Просмотр медиа)$, class:^(org.telegram.desktop.*)$

# Opacity
windowrulev2 = opacity 1.0 override 1.0 override, fullscreen:1
windowrulev2 = opacity 1.0 override 1.0 override, class:^(firefox)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(imv)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(vlc)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(steam_app_.*)$

# Minecraft
windowrulev2 = immediate, class:^(Minecraft*)$
windowrulev2 = immediate, title:^(Minecraft*)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(Minecraft*)$

# Layer Rules
layerrule = blur, waybar
layerrule = ignorezero, waybar

# -----------------------------------------------------
# KEY BINDINGS
# -----------------------------------------------------
# Applications
bind = SUPER, Return, exec, kitty
bind = SUPER, D, exec, rofi -show drun
bind = , XF86Calculator, exec, kcalc
bind = SUPER, F, exec, thunar

# System
bind = SUPER, ESCAPE, exec, hyprlock
bind = SUPER SHIFT, M, exec, wlogout
bind = SUPER, R, exec, hyprctl reload

# Audio (bindel = repeat & lock)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Screenshots (Swappy & Hyprshot)
# Shift+Print = Region -> Edit
bind = SUPER SHIFT, S, exec, hyprshot -m region --freeze --raw | swappy -f -
# Alt+Print = Window -> Edit
bind = ALT, PRINT, exec, hyprshot -m window --clipboard-only --raw | swappy -f -
# Print = Monitor -> Clipboard
bind = , PRINT, exec, hyprshot -m output --clipboard-only

# Window Management
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, T, togglefloating
bind = SUPER SHIFT, F, fullscreen
bind = SUPER, Z, togglespecialworkspace, minimized
bind = SUPER SHIFT, Z, movetoworkspacesilent, special:minimized

# Focus
# bind = SUPER, left, movefocus, l
# bind = SUPER, right, movefocus, r
# bind = SUPER, up, movefocus, u
# bind = SUPER, down, movefocus, d
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Move Window
# bind = SUPER SHIFT, left, movewindow, l
# bind = SUPER SHIFT, right, movewindow, r
# bind = SUPER SHIFT, up, movewindow, u
# bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# Resize Window (binde = repeat)
# binde = SUPER ALT, left, resizeactive, -20 0
# binde = SUPER ALT, right, resizeactive, 20 0
# binde = SUPER ALT, up, resizeactive, 0 -20
# binde = SUPER ALT, down, resizeactive, 0 20
binde = SUPER ALT, H, resizeactive, -20 0
binde = SUPER ALT, L, resizeactive, 20 0
binde = SUPER ALT, K, resizeactive, 0 -20
binde = SUPER ALT, J, resizeactive, 0 20

# Mouse Binds
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER SHIFT, mouse:272, resizewindow

# Workspaces (Switch)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Workspaces (Move Window Silent)
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5

# Move Workspaces
bind = SUPER CTRL, left, movecurrentworkspacetomonitor, l
bind = SUPER CTRL, right, movecurrentworkspacetomonitor, r
bind = SUPER CTRL, H, movecurrentworkspacetomonitor, l
bind = SUPER CTRL, L, movecurrentworkspacetomonitor, r
