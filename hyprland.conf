# Мониторы
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = DVI-D-1, 1280x1024@75, 1920x0, 1

# Переменные окружения
env = XCURSOR_THEME, Tela-dark
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, Tela-dark # Новый формат курсоров в Hyprland
env = HYPRCURSOR_SIZE, 24

# Форсируем Wayland для Firefox и приложений
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Темизация Qt (чтобы Dolphin был красивым)
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# --- АВТОЗАПУСК ---
exec-once = /usr/libexec/polkit-kde-authentication-agent-1
exec-once = flatpak run com.github.wwmm.easyeffects --gapplication-service

# Красиво?
exec-once = hypridle
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

windowrulev2 = float,class:^(org.kde.kcalc)$
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float,class:^(org.kde.gwenview)$
windowrulev2 = float,class:^(org.kde.ark)$
windowrulev2 = float,class:^(missioncenter)$
windowrulev2 = float,class:^(org.kde.plasma-systemmonitor)$
windowrulev2 = float,class:^(xdg-desktop-portal-gtk)$
windowrulev2 = dimaround,class:^(xdg-desktop-portal-gtk)$

# Telegram Media Viewer
windowrulev2 = float, title:^(Media viewer|Просмотр медиа)$, class:^(org.telegram.desktop.*)$
windowrulev2 = fullscreen, title:^(Media viewer|Просмотр медиа)$, class:^(org.telegram.desktop.*)$
windowrulev2 = workspace unset, title:^(Media viewer|Просмотр медиа)$, class:^(org.telegram.desktop.*)$

layerrule = blur, waybar
layerrule = ignorezero, waybar

# Клавиши
bind = SUPER, Return, exec, kitty
bind = SUPER, Q, killactive,
bind = SUPER, L, exec, hyprlock
bind = SUPER SHIFT, M, exec, wlogout
bind = SUPER, R, exec, hyprctl reload
bind = SUPER, D, exec, rofi -show drun
bind = , XF86Calculator, exec, kcalc
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

bind = SUPER ALT, left, resizeactive, -60 0
bind = SUPER ALT, right, resizeactive, 60 0
bind = SUPER ALT, up, resizeactive, 0 -60
bind = SUPER ALT, down, resizeactive, 0 60

# Перемещение по рабочим столам
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5

bind = SUPER SHIFT, Z, movetoworkspacesilent, special:minimized
bind = SUPER, Z, togglespecialworkspace, minimized

bind = SUPER SHIFT, T, togglefloating
bind = SUPER SHIFT, F, fullscreen

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER SHIFT, mouse:272, resizewindow

# Region
bind = SHIFT, PRINT, exec, hyprshot -m region --freeze --raw | swappy -f -
# Whole window
bind = ALT, PRINT, exec, hyprshot -m window --clipboard-only --raw | swappy -f -
# Whole monitor
bind = , PRINT, exec, hyprshot -m output --clipboard-only
# Quick shot (no swappy)
bind = SUPER SHIFT, S, exec, hyprshot -m region --freeze --clipboard-only

# Курсор
input {
	kb_layout = us,ru
	kb_options = grp:alt_shift_toggle
	follow_mouse = 2
}
device {
	name = logitech-g502-hero-gaming-mouse
	accel_profile = flat
	sensitivity = -0.35
}
cursor {
	no_warps = true
}

general {
	gaps_in = 3
	gaps_out = 5
	border_size = 2
	col.active_border = rgba(180,180,120,0.8)
	col.inactive_border = rgba(30,30,46,0.7)
}

decoration {
	rounding = 10
	blur {
		enabled = true
		size = 3
		passes = 2 # Качество размытия
		ignore_opacity = true
	}
	shadow {
		enabled = true
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}
}

animations {
	enabled = true
	bezier = ease, 0.4, 0.02, 0.21, 1
	animation = windows, 1, 3, ease
}

dwindle {
	pseudotile = true # Позволяет псевдо-тайлинг (Win+P)
	preserve_split = true # Сохраняет структуру при перетаскивании
}
