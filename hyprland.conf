# -----------------------------------------------------
# MONITORS
# -----------------------------------------------------
monitorv2 {
	output = HDMI-A-1
	mode = 1920x1080@60
	position = 0x0
	scale = 1
}
monitorv2 {
	output = DP-2
	mode = 1600x900@60
	position = 1920x180
	scale = 1
}
exec-once = xrandr --output HDMI-A-1 --primary

# -----------------------------------------------------
# ENVIRONMENT VARIABLES
# -----------------------------------------------------
# Cursor
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24

# Backend
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Qt / KDE
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CONFIG_HOME,$HOME/.config
env = XDG_DATA_HOME,$HOME/.local/share
env = XDG_CACHE_HOME,$HOME/.cache

# -----------------------------------------------------
# AUTOSTART
# -----------------------------------------------------
# System
exec-once = systemctl --user start hyprpolkitagent

exec-once = hypridle
exec-once = hyprpaper
exec-once = quickshell
exec-once = swaync

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Audio Effects
exec-once = LANG=C easyeffects --service-mode

# -----------------------------------------------------
# INPUT & DEVICES
# -----------------------------------------------------
input {
	kb_layout = us,ru
	kb_options = grp:alt_shift_toggle
	follow_mouse = 2
	numlock_by_default = true
}

cursor {
	no_warps = true
}

device {
	name = logitech-g502-hero-gaming-mouse
	accel_profile = flat
	sensitivity = -0.35
}

device {
	name = wacom-one-by-wacom-m-pen
	output = HDMI-A-1
	left_handed = true
	active_area_size = 216, 121.5
}

# -----------------------------------------------------
# GENERAL & LAYOUT
# -----------------------------------------------------
general {
	gaps_in = 2
	gaps_out = 3
	border_size = 1
	col.active_border = rgba(170,170,180,0.9)
	col.inactive_border = rgba(30,30,46,0.7)
	layout = dwindle
	allow_tearing = true
}

dwindle {
	pseudotile = true
	preserve_split = true
	force_split = 2
}

xwayland {
	force_zero_scaling = true
}

# -----------------------------------------------------
# DECORATION & ANIMATION
# -----------------------------------------------------
decoration {
	rounding = 4
	
	blur {
		enabled = true
		size = 1
		passes = 1
	}

	shadow {
		enabled = true
		range = 5
		render_power = 3
		color = rgba(0,0,20,0.5)
	}
}

animations {
	enabled = true
	bezier = ease, 0.4, 0.02, 0.21, 1
	animation = windows, 1, 2, ease
	animation = workspaces, off
}

# -----------------------------------------------------
# WORKSPACES
# -----------------------------------------------------

workspace = 1, monitor:HDMI-A-1, defaultName:uwu, layout:master
workspace = 2, monitor:HDMI-A-1

# -----------------------------------------------------
# WINDOW RULES
# -----------------------------------------------------
# Floating Utils
windowrule = float on, center on, match:class ^(qalculate-gtk|org.kde.kcalc)$
windowrule = float on, center on, size 800 500, match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(missioncenter|org.kde.plasma-systemmonitor|org.kde.ark)$
windowrule = float on, match:class ^(steam)$, match:title negative:^(Steam)$

# Image Viewers
windowrule = float on, match:class ^(imv)$

# Dialogs (Save/Open file)
windowrule {
	name = xdg_dialogs
	match:class = ^(xdg-desktop-portal.*)$
	float = on
	center = on
	dim_around = on
}

# Telegram Media
windowrule {
	name = telegram_media
	match:class = ^(org.telegram.desktop)$
	match:title = ^(Media viewer|Просмотр медиа)$
	float = on
	opaque = on
	fullscreen = on
	workspace = unset
}

windowrule {
	name = telegram_picker
	match:class = ^(org.telegram.desktop)$
	match:title = ^(Choose Files)$
	float = on
	opaque = on
	center = on
	dim_around = on
}

windowrule {
	name = qemu
	match:class = qemu
	float = on
	center = on
	opaque = on
}

windowrule {
	name = qbittorrent
	match:class = ^(org.qbittorrent.qBittorrent)$
	match:title = negative:^(qBittorrent v.*)$
	float = on
	center = on
}

# Opacity
windowrule = opaque on, match:class ^(firefox|imv|mpv|vlc|steam_app_.*|Minecraft.*|krita)$
windowrule = opaque on, match:fullscreen on

# No tearing
windowrule = immediate on, match:class ^(Minecraft*)&
windowrule = immediate on, match:class ^(krita)$

# Krita
windowrule = no_focus on, match:class ^(krita)$, match:title ^(Krita)$, match:float on

# Layer Rules
layerrule {
	name = for_waybar
	match:namespace = waybar
	blur = on
}

# -----------------------------------------------------
# KEY BINDINGS
# -----------------------------------------------------
# Applications
bind = SUPER, Return, exec, kitty
bind = SUPER, D, exec, rofi -show drun
bind = , XF86Calculator, exec, kcalc
bind = SUPER, F, exec, thunar
bind = SUPER, B, exec, firefox

# System
bind = SUPER, ESCAPE, exec, loginctl lock-session
bind = SUPER SHIFT, M, exec, ~/.config/hypr/power-menu.sh
bind = SUPER SHIFT ALT, M, exec, hyprctl logout
bind = SUPER, R, exec, hyprctl reload

# Audio (bindel = repeat & lock)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Screenshots (Swappy & Hyprshot)
# Shift+Print = Region -> Edit
bind = SUPER SHIFT, S, exec, hyprshot -m region --freeze --raw | swappy -f -
# Alt+Print = Window -> Edit
bind = ALT, PRINT, exec, hyprshot -m window --clipboard-only --raw | swappy -f -
# Print = Monitor -> Clipboard
bind = , PRINT, exec, hyprshot -m output --clipboard-only

# Window Management
bind = SUPER, Q, killactive
bind = SUPER SHIFT, T, togglefloating
bind = SUPER SHIFT, F, fullscreen
bind = SUPER, Z, togglespecialworkspace, minimized
bind = SUPER SHIFT, Z, movetoworkspacesilent, special:minimized

# Focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Move Window
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# Resize Window (binde = repeat)
binde = SUPER ALT, left, resizeactive, -20 0
binde = SUPER ALT, right, resizeactive, 20 0
binde = SUPER ALT, up, resizeactive, 0 -20
binde = SUPER ALT, down, resizeactive, 0 20
binde = SUPER ALT, H, resizeactive, -20 0
binde = SUPER ALT, L, resizeactive, 20 0
binde = SUPER ALT, K, resizeactive, 0 -20
binde = SUPER ALT, J, resizeactive, 0 20

# Mouse Binds
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER SHIFT, mouse:272, resizewindow

# Workspaces (Switch)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8

# Workspaces (Move Window Silent)
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8

# Move Workspaces
bind = SUPER CTRL, left, movecurrentworkspacetomonitor, l
bind = SUPER CTRL, right, movecurrentworkspacetomonitor, r
bind = SUPER CTRL, H, movecurrentworkspacetomonitor, l
bind = SUPER CTRL, L, movecurrentworkspacetomonitor, r
